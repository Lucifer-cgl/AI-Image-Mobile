<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地画境</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f4fa;color:#282338;font:16px/1.6 system-ui,sans-serif}main{max-width:900px;margin:12px auto;padding:20px;background:white;min-height:100vh}h1{margin:0 0 6px}p{color:#665e75;overflow-wrap:anywhere}label{display:block;margin:16px 0 6px;font-weight:650}textarea,select,input{font:inherit;width:100%;padding:12px;border:1px solid #d7d1e2;border-radius:10px}textarea{min-height:145px;resize:vertical}button{background:#7929d9;color:white;border:0;border-radius:11px;padding:13px 20px;font:inherit;font-weight:650;margin-top:18px}button:disabled{opacity:.5}.secondary{background:#746d7e;margin-left:8px}.hint{font-size:14px}.error{color:#bd2037}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{margin:0;flex:1}.history-card{border:1px solid #e5dff0;border-radius:14px;padding:10px;margin:12px 0}.history-card img,#preview,#sourcePreview{width:100%;max-height:620px;object-fit:contain;border-radius:10px}.actions{display:flex;gap:8px}.actions button{flex:1;margin-top:8px}#status{white-space:pre-wrap}.progress-wrap{height:18px;background:#ece8f2;border-radius:99px;overflow:hidden;margin:12px 0 4px}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#7929d9,#b55cff);transition:width .25s}.progress-label{text-align:center;font-size:14px;color:#665e75}</style>
<main><h1>本地画境</h1><p id="model">正在检查手机模型包…</p><p class="hint">模型和图片只保存在手机中。模型包按需下载，生成过程不调用云端。</p>
<div class="tabs"><button onclick="showTab('generate')">生成图片</button><button class="secondary" onclick="showTab('models')">模型管理</button><button class="secondary" onclick="showTab('history')">历史记录</button></div>
<section id="generateTab"><form id="form"><label>画面描述</label><textarea id="prompt" required maxlength="3000" placeholder="当前图像链路优先使用英文；中文画面规划器接入后会自动转换"></textarea>
<label>上传原图（可选）</label><input id="sourceImage" type="file" accept="image/*"><img id="sourcePreview" hidden><button id="clearSource" type="button" class="secondary" hidden>移除原图</button><div id="strengthBox" hidden><label>修改强度：<span id="strengthValue">0.45</span></label><input id="strength" type="range" min="0.10" max="0.90" step="0.05" value="0.45"></div>
<label>输出尺寸</label><select id="size"><option>256x256</option><option>512x512</option><option>512x768</option><option>768x512</option><option>768x768</option><option>720x1280</option><option>1280x720</option><option>1080x1920</option><option>1920x1080</option></select><p class="hint">手机以安全尺寸生成，再放大到所选输出尺寸。</p>
<label>生成模式</label><select id="steps"><option value="2">设备验证（2步）</option><option value="4" selected>LCM 快速（4步）</option><option value="6">LCM 细化（6步）</option><option value="8">LCM 高质量（8步）</option></select>
<label>不希望出现的内容（可选）</label><input id="negative" value=""><label><input id="storageMapped" type="checkbox" checked style="width:auto;margin-right:8px">存储映射加速（推荐）</label><p class="hint">直接映射模型并复用系统文件缓存，可降低内存峰值；不会额外复制一份模型。</p><button id="generate" disabled>模型未就绪</button></form><div id="progressBox" hidden><div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div><div id="progressLabel" class="progress-label">0%</div></div><p id="status"></p><img id="preview" hidden></section>
<section id="modelsTab" hidden><p>首次使用请安装必需模型。国内镜像优先，断点续传，下载完成后自动校验 SHA-256。</p><div id="modelList"></div><button class="secondary" onclick="AndroidGenerator.cancelModelDownload()">取消当前下载</button></section>
<section id="historyTab" hidden><div id="historyList"></div></section></main>
<script>
const el=id=>document.getElementById(id);let initImage='',generationStarted=0,lastProgressAt=0,lastStage='',generationTimer=0;
function showTab(tab){el('generateTab').hidden=tab!=='generate';el('modelsTab').hidden=tab!=='models';el('historyTab').hidden=tab!=='history';if(tab==='history')loadHistory();if(tab==='models')loadModels()}
setInterval(()=>{try{const status=AndroidGenerator.status(),p=AndroidGenerator.installProgress();el('model').textContent=status;if(p<100){el('generate').disabled=true;el('generate').textContent='模型准备中…';el('progressBox').hidden=false;setProgress(p,status)}else{if(!generationStarted){el('generate').disabled=false;el('generate').textContent='生成';setProgress(100,'模型已就绪');setTimeout(()=>{if(!generationStarted)el('progressBox').hidden=true},800)}}}catch{}},700);
function setProgress(percent,stage){const p=Math.max(0,Math.min(100,Number(percent)||0));el('progressBar').style.width=p+'%';el('progressLabel').textContent=p+'% · '+stage}
function startGenerationClock(){generationStarted=lastProgressAt=Date.now();lastStage='开始任务';clearInterval(generationTimer);generationTimer=setInterval(()=>{if(!generationStarted)return;const elapsed=Math.floor((Date.now()-generationStarted)/1000),idle=Math.floor((Date.now()-lastProgressAt)/1000);let note=`已运行 ${Math.floor(elapsed/60)}分${elapsed%60}秒`;if(idle>=120)note+=` · 已 ${Math.floor(idle/60)} 分钟无新进度，可能内存紧张或系统暂停了任务。可再等待，若应用无响应请重启并改用 512×512。`;el('status').textContent=note+'\n当前：'+lastStage},1000)}
function stopGenerationClock(){generationStarted=0;clearInterval(generationTimer);generationTimer=0}
el('strength').oninput=()=>el('strengthValue').textContent=Number(el('strength').value).toFixed(2);
el('sourceImage').onchange=()=>{const f=el('sourceImage').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{initImage=r.result;el('sourcePreview').src=initImage;el('sourcePreview').hidden=false;el('clearSource').hidden=false;el('strengthBox').hidden=false};r.readAsDataURL(f)};
el('clearSource').onclick=()=>{initImage='';el('sourceImage').value='';el('sourcePreview').hidden=true;el('clearSource').hidden=true;el('strengthBox').hidden=true};
el('form').onsubmit=e=>{e.preventDefault();el('generate').disabled=true;el('progressBox').hidden=false;setProgress(1,'开始任务');el('status').className='';el('status').textContent='正在启动手机本地模型…';startGenerationClock();const [ow,oh]=el('size').value.split('x').map(Number);const scale=Math.min(1,512/Math.max(ow,oh));const w=Math.max(256,Math.floor(ow*scale/64)*64),h=Math.max(256,Math.floor(oh*scale/64)*64);const p=el('prompt').value;try{AndroidGenerator.generate(JSON.stringify({prompt:p,negative_prompt:el('negative').value,width:w,height:h,output_width:ow,output_height:oh,steps:Number(el('steps').value),strength:Number(el('strength').value),init_image:initImage,storage_mapped:el('storageMapped').checked}))}catch(err){stopGenerationClock();el('generate').disabled=false;el('status').className='error';el('status').textContent='无法启动生成：'+err}};
window.onGenerationProgress=text=>{const r=JSON.parse(text);lastProgressAt=Date.now();lastStage=r.stage;setProgress(r.percent,r.stage)};
window.onGenerationResult=text=>{const r=JSON.parse(text);stopGenerationClock();el('generate').disabled=false;if(!r.ok){el('status').className='error';el('status').textContent='生成失败：'+r.error+'\n建议：先用 512×512，关闭其他大型应用后重试。';return}el('status').textContent='生成完成，已加入历史记录。种子：'+r.seed;el('preview').src=r.data_url;el('preview').hidden=false};
function loadHistory(){let items=[];try{items=JSON.parse(AndroidGenerator.history())}catch{}el('historyList').innerHTML=items.length?'':'暂无历史记录';for(const i of items){const card=document.createElement('div');card.className='history-card';card.innerHTML=`<img src="${i.url}"><div class="actions"><button>保存到相册</button><button class="secondary">删除</button></div>`;card.querySelectorAll('button')[0].onclick=()=>alert(AndroidGenerator.saveToGallery(i.name)?'已保存到相册':'保存失败');card.querySelectorAll('button')[1].onclick=()=>{if(confirm('删除这张图片？')){AndroidGenerator.deleteHistory(i.name);loadHistory()}};el('historyList').append(card)}}
function hasDownloadSource(file){const direct=(file.sources||[]).length>0,parts=file.parts||[];return direct||(parts.length>0&&parts.every(part=>(part.sources||[]).length>0))}
function loadModels(){let c={packages:[]};try{c=JSON.parse(AndroidGenerator.modelCatalog())}catch{}const box=el('modelList');box.innerHTML=c.error?`<p class="error">${c.error}</p>`:'';for(const p of c.packages||[]){const d=document.createElement('div');d.className='history-card';const files=p.files||[],size=files.reduce((n,f)=>n+(f.bytes||0),0);const available=files.length>0&&files.every(hasDownloadSource);d.innerHTML=`<strong>${p.name}${p.required?'（必需）':''}</strong><p>${p.runtime||p.candidate||''}</p><p>${p.installed?'已安装':available?'未安装 · '+(size/1073741824).toFixed(2)+' GB':files.length?'本地测试包，尚未发布下载源':'尚未发布移动包'}</p><div class="actions"><button ${p.installed||!available?'disabled':''}>下载/继续</button><button class="secondary" ${p.installed?'':'disabled'}>删除</button></div><p class="hint" data-state></p>`;const b=d.querySelectorAll('button');b[0].onclick=()=>{b[0].disabled=true;AndroidGenerator.downloadModel(p.id)};b[1].onclick=()=>{if(confirm('删除此模型包？')){AndroidGenerator.deleteModel(p.id);loadModels()}};d.dataset.id=p.id;box.append(d)}}
window.onModelProgress=text=>{const r=JSON.parse(text),d=document.querySelector(`[data-id="${r.id}"] [data-state]`);if(d)d.textContent=r.percent+'% · '+r.message};
window.onModelChanged=text=>{const r=JSON.parse(text);if(!r.ok)alert('模型安装失败：'+r.error);loadModels()};
</script></html>
